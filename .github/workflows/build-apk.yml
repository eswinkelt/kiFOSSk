name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signaturschlüssel bereitstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kifossk.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kifossk.jks" >> "$GITHUB_ENV"

      - name: Version bestimmen
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.5-familienboard.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/*.apk kiFOSSk-familienboard-debug.apk
          cp app/build/outputs/apk/release/*.apk kiFOSSk-familienboard-release.apk
          ls -l kiFOSSk-familienboard-*.apk

      - name: Debug-APK für ADB
        uses: actions/upload-artifact@v4
        with:
          name: kifossk-familienboard-apk
          path: kiFOSSk-familienboard-debug.apk
          if-no-files-found: error

      - name: Release „latest“ aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Familienboard Kiosk (latest)" \
              --notes "Automatisch gebaut aus ${{ github.sha }}. Signiert mit dem festen Familienboard-Schlüssel." --latest
          gh release upload latest kiFOSSk-familienboard-release.apk --clobber
          gh release edit latest --latest
